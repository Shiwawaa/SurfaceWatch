services:
  surfacewatch:
    build: .
    container_name: surfacewatch
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DATABASE_URL=sqlite:///./data/surfacewatch.db
    volumes:
      - surfacewatch_data:/app/data
    restart: unless-stopped

volumes:
  surfacewatch_data:
